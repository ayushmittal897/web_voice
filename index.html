<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>BigTalk Voice Chat</title>
  <style>
    :root {
      --bg: #fdfbf7;
      --text: #111;
      --primary: #d7263d;
      --primary-active: #b51f33;
      --dark: #2d2d2d;
      --light-gray: #e0e0e0;
      --mic-on: #28a745;
      --mic-off: #6c757d;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
    }
    * { box-sizing: border-box; }
    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 400px;
    }
    .screen.active { display: flex; }
    h1 { font-size: 2rem; margin-bottom: 10px; }
    p.status {
      font-size: 1.5rem;
      line-height: 1.4;
      min-height: 4.5rem;
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    input[type="text"] {
      font-size: 2rem;
      padding: 15px;
      width: 100%;
      text-align: center;
      border: 3px solid #ccc;
      border-radius: 12px;
      margin-bottom: 20px;
      text-transform: uppercase;
      background: #fff;
    }
    input[type="text"]:focus { outline: none; border-color: var(--primary); }
    .big-btn {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: none;
      font-size: 2.5rem;
      font-weight: bold;
      color: white;
      cursor: pointer;
      transition: transform 0.1s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }
    .big-btn:active { transform: scale(0.95); }
    .big-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-talk { background-color: var(--primary); box-shadow: 0 10px 20px rgba(215, 38, 61, 0.4); }
    .btn-end { background-color: var(--dark); box-shadow: 0 10px 20px rgba(45, 45, 45, 0.4); }
    .btn-mic {
      background-color: var(--mic-on);
      width: 140px;
      height: 140px;
      font-size: 1.5rem;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      margin-top: 10px;
    }
    .btn-mic.muted { background-color: var(--mic-off); }
    .btn-save {
      width: 100%;
      padding: 20px;
      font-size: 1.5rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-save:active { background: var(--primary-active); }
    .room-info { font-size: 1.2rem; margin-top: 40px; color: #555; }
    .room-info button {
      background: none; border: none; color: var(--primary); font-size: 1.2rem;
      text-decoration: underline; cursor: pointer; padding: 10px; margin-left: 10px;
    }
    .controls-wrapper { display: flex; flex-direction: column; align-items: center; gap: 20px; }
    .version { font-size: 0.8rem; color: #aaa; position: absolute; bottom: 10px; }
    @media (prefers-reduced-motion: reduce) { .big-btn { transition: none; } }
  </style>
</head>
<body>

  <div id="screenSetup" class="screen">
    <h1>BigTalk Setup</h1>
    <p class="status">Enter your family room code</p>
    <input type="text" id="roomInput" placeholder="Leave empty for random room">
    <button id="saveBtn" class="btn-save">SAVE & CONTINUE</button>
  </div>

  <div id="screenMain" class="screen">
    <p id="mainStatus" class="status">Getting ready...</p>
    <div id="idleControls" class="controls-wrapper">
      <button id="talkBtn" class="big-btn btn-talk" disabled>TALK</button>
      <div class="room-info">
        Room: <strong id="displayRoom">...</strong> 
        <button id="changeRoomBtn">Change</button>
      </div>
    </div>
    <div id="callControls" class="controls-wrapper" style="display: none;">
      <button id="endBtn" class="big-btn btn-end">END</button>
      <button id="micBtn" class="big-btn btn-mic">MIC IS ON</button>
    </div>
  </div>

  <div class="version" id="versionText">v2.0.0 | Disconnected</div>

  <script>
    // Configuration
    // REPLACEME: Replace this URL with your actual Render URL when deployed
    const RENDER_DOMAIN = "your-render-url.onrender.com";
    const IS_LOCAL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
    
    const API_URL = IS_LOCAL ? 'http://localhost:8080' : `https://${RENDER_DOMAIN}`;
    const WS_URL = IS_LOCAL ? 'ws://localhost:8080' : `wss://${RENDER_DOMAIN}`;

    // Elements
    const screenSetup = document.getElementById('screenSetup');
    const screenMain = document.getElementById('screenMain');
    const roomInput = document.getElementById('roomInput');
    const saveBtn = document.getElementById('saveBtn');
    const mainStatus = document.getElementById('mainStatus');
    const displayRoom = document.getElementById('displayRoom');
    const changeRoomBtn = document.getElementById('changeRoomBtn');
    const idleControls = document.getElementById('idleControls');
    const callControls = document.getElementById('callControls');
    const talkBtn = document.getElementById('talkBtn');
    const endBtn = document.getElementById('endBtn');
    const micBtn = document.getElementById('micBtn');
    const versionText = document.getElementById('versionText');

    // State
    let roomCode = localStorage.getItem('bigtalk_room') || '';
    let localStream = null;
    let ws = null;
    let pc = null;
    let isServerReady = false;
    let isMuted = false;
    let wakeLock = null;
    let connectionTimeoutId = null;
    let iceCandidateQueue = [];
    let isRemoteDescriptionSet = false;
    let audioEl = new Audio();
    audioEl.autoplay = true;

    const iceConfig = {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "turn:openrelay.metered.ca:80", username: "openrelayproject", credential: "openrelayproject" },
        { urls: "turn:openrelay.metered.ca:443", username: "openrelayproject", credential: "openrelayproject" }
      ]
    };

    // Initialization
    function init() {
      if (roomCode) {
        showScreen('main');
        checkServer();
      } else {
        showScreen('setup');
      }
    }

    function showScreen(screen) {
      screenSetup.classList.remove('active');
      screenMain.classList.remove('active');
      if (screen === 'setup') {
        screenSetup.classList.add('active');
        roomInput.value = roomCode;
      } else {
        screenMain.classList.add('active');
        displayRoom.textContent = roomCode || 'RANDOM';
      }
    }

    function sanitizeRoom(code) {
      return code.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
    }

    function setStatus(text) {
      mainStatus.textContent = text;
    }

    function updateDebugInfo(stateText) {
      const pcState = pc ? pc.iceConnectionState : 'no-pc';
      const wsState = ws ? (ws.readyState === 1 ? 'ws-open' : 'ws-closed') : 'no-ws';
      versionText.textContent = `v2.0.0 | ${stateText || ''} | ${wsState} | ${pcState}`;
    }

    // Server Wakeup
    async function checkServer() {
      if (isServerReady) return;
      const startTime = Date.now();
      talkBtn.disabled = true;
      setStatus("Getting ready...");
      
      while (!isServerReady) {
        if (Date.now() - startTime > 60000) {
          setStatus("Server took too long to wake up. Refresh the page.");
          return;
        }
        try {
          const res = await fetch(API_URL + '/health');
          if (res.ok) {
            isServerReady = true;
            talkBtn.disabled = false;
            setStatus("Press TALK when you are ready.");
            updateDebugInfo('Ready');
            break;
          }
        } catch(e) {}
        await new Promise(r => setTimeout(r, 3000));
      }
    }

    saveBtn.addEventListener('click', () => {
      roomCode = sanitizeRoom(roomInput.value);
      localStorage.setItem('bigtalk_room', roomCode);
      showScreen('main');
      checkServer();
    });

    changeRoomBtn.addEventListener('click', () => {
      endCall();
      showScreen('setup');
    });

    micBtn.addEventListener('click', () => {
      if (localStream) {
        isMuted = !isMuted;
        localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
        micBtn.classList.toggle('muted', isMuted);
        micBtn.textContent = isMuted ? 'MIC IS OFF' : 'MIC IS ON';
      }
    });

    // START CALL
    talkBtn.addEventListener('click', async () => {
      setStatus("Asking for microphone...");
      
      // Clean up any old state completely
      closeSocket();
      closePeerConnectionOnly();
      
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        isMuted = false;
        micBtn.classList.remove('muted');
        micBtn.textContent = 'MIC IS ON';
        
        try {
          if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
        } catch(e) {}
      } catch (err) {
        setStatus("Microphone permission denied.");
        return;
      }
      
      idleControls.style.display = 'none';
      callControls.style.display = 'flex';
      
      connectSocket();
    });

    // WEBSOCKET LOGIC
    function connectSocket(retryCount = 0) {
      if (ws) {
        ws.onclose = null;
        ws.close();
      }
      setStatus(retryCount > 0 ? "Reconnecting..." : "Connecting to server...");
      
      ws = new WebSocket(WS_URL);
      
      ws.onopen = () => {
        updateDebugInfo('WS Connected');
        ws.send(JSON.stringify({ type: 'join', room: roomCode }));
        setStatus("Waiting for someone to join...");
        
        // Timeout if not connected within 20s
        clearTimeout(connectionTimeoutId);
        connectionTimeoutId = setTimeout(() => {
          if (pc && pc.iceConnectionState !== 'connected' && pc.iceConnectionState !== 'completed') {
            setStatus("Could not connect. Press END and try again.");
            endCall();
          }
        }, 20000);
      };
      
      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        
        if (msg.type === 'full') {
          setStatus("Room is full. Try another room.");
          endCall();
        }
        else if (msg.type === 'wait-for-offer') {
          // Other peer is creating the offer, we just wait.
          setupPeerConnection();
        }
        else if (msg.type === 'peer-joined') {
          // We are first, so we create the offer.
          createOffer();
        }
        else if (msg.type === 'peer-left') {
          closePeerConnectionOnly();
          setStatus("The other person left. Waiting for someone to join...");
          // Keep socket and mic active, ready for next join.
        }
        else if (msg.type === 'signal') {
          handleSignal(msg.data);
        }
      };
      
      ws.onclose = () => {
        updateDebugInfo('WS Dropped');
        if (callControls.style.display !== 'none') {
          const delay = Math.min(1000 * Math.pow(2, retryCount), 4000);
          setTimeout(() => connectSocket(retryCount + 1), delay);
        }
      };
      
      ws.onerror = (e) => {
        console.error("WebSocket error");
      };
    }

    function closeSocket() {
      if (ws) {
        if (ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'leave' }));
        }
        ws.onclose = null;
        ws.close();
        ws = null;
      }
    }

    // WEBRTC LOGIC
    function setupPeerConnection() {
      closePeerConnectionOnly();
      iceCandidateQueue = [];
      isRemoteDescriptionSet = false;
      
      pc = new RTCPeerConnection(iceConfig);
      
      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
      
      pc.onicecandidate = (event) => {
        if (event.candidate && ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'signal', data: { candidate: event.candidate } }));
        }
      };
      
      pc.ontrack = (event) => {
        audioEl.srcObject = event.streams[0];
        setStatus("Connected. You can talk now.");
        clearTimeout(connectionTimeoutId);
      };
      
      pc.oniceconnectionstatechange = () => {
        updateDebugInfo();
        if (pc.iceConnectionState === 'failed' || pc.iceConnectionState === 'disconnected') {
           setStatus("Call disconnected. Waiting for someone to join...");
           closePeerConnectionOnly();
        }
      };
    }

    function closePeerConnectionOnly() {
      if (pc) {
        pc.close();
        pc = null;
      }
      updateDebugInfo();
    }

    async function createOffer() {
      setupPeerConnection();
      try {
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'signal', data: { sdp: pc.localDescription } }));
        }
      } catch (e) {
        console.error("Error creating offer", e);
      }
    }

    async function handleSignal(data) {
      if (!pc) setupPeerConnection();
      
      try {
        if (data.sdp) {
          await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
          isRemoteDescriptionSet = true;
          
          // Process queued ICE candidates
          for (const cand of iceCandidateQueue) {
            await pc.addIceCandidate(cand);
          }
          iceCandidateQueue = [];
          
          if (data.sdp.type === 'offer') {
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            if (ws && ws.readyState === WebSocket.OPEN) {
              ws.send(JSON.stringify({ type: 'signal', data: { sdp: pc.localDescription } }));
            }
          }
        } else if (data.candidate) {
          const candidate = new RTCIceCandidate(data.candidate);
          if (isRemoteDescriptionSet) {
            await pc.addIceCandidate(candidate);
          } else {
            iceCandidateQueue.push(candidate);
          }
        }
      } catch(e) {
        console.error("Signal error", e);
      }
    }

    // END CALL
    endBtn.addEventListener('click', endCall);

    function endCall() {
      closeSocket();
      closePeerConnectionOnly();
      
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
      }
      clearTimeout(connectionTimeoutId);
      if (wakeLock) {
        wakeLock.release().catch(()=>{});
        wakeLock = null;
      }
      
      idleControls.style.display = 'flex';
      callControls.style.display = 'none';
      setStatus(isServerReady ? "Press TALK when you are ready." : "Getting ready...");
      updateDebugInfo('Idle');
    }

    init();
  </script>
</body>
</html>
