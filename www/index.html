<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>BigTalk Voice Chat</title>
  <style>
    :root {
      --bg: #fdfbf7;
      --text: #111;
      --primary: #d7263d;
      --primary-active: #b51f33;
      --dark: #2d2d2d;
      --light-gray: #e0e0e0;
      --mic-on: #28a745;
      --mic-off: #6c757d;
      --error-bg: #ffebee;
      --error-text: #b71c1c;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
    }
    * { box-sizing: border-box; }
    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 400px;
    }
    .screen.active { display: flex; }
    h1 { font-size: 2rem; margin-bottom: 10px; }
    
    .status-container {
      margin-bottom: 20px;
      width: 100%;
    }
    p.status {
      font-size: 1.3rem;
      line-height: 1.4;
      font-weight: bold;
      margin: 0 0 10px 0;
    }
    .error-box {
      background-color: var(--error-bg);
      color: var(--error-text);
      padding: 10px;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 20px;
      display: none;
      word-wrap: break-word;
    }
    .active-room-display {
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--primary);
      margin-bottom: 20px;
      display: none;
      background: #fff;
      border: 2px dashed var(--primary);
      padding: 10px 20px;
      border-radius: 12px;
    }
    
    input[type="text"] {
      font-size: 2rem;
      padding: 15px;
      width: 100%;
      text-align: center;
      border: 3px solid #ccc;
      border-radius: 12px;
      margin-bottom: 20px;
      text-transform: uppercase;
      background: #fff;
    }
    input[type="text"]:focus { outline: none; border-color: var(--primary); }
    
    .big-btn {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: none;
      font-size: 2.5rem;
      font-weight: bold;
      color: white;
      cursor: pointer;
      transition: transform 0.1s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }
    .big-btn:active { transform: scale(0.95); }
    .big-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-talk { background-color: var(--primary); box-shadow: 0 10px 20px rgba(215, 38, 61, 0.4); }
    .btn-end { background-color: var(--dark); box-shadow: 0 10px 20px rgba(45, 45, 45, 0.4); }
    .btn-mic {
      background-color: var(--mic-on);
      width: 140px;
      height: 140px;
      font-size: 1.5rem;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      margin-top: 10px;
    }
    .btn-mic.muted { background-color: var(--mic-off); }
    .btn-save {
      width: 100%;
      padding: 20px;
      font-size: 1.5rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-save:active { background: var(--primary-active); }
    .room-info { font-size: 1.2rem; margin-top: 40px; color: #555; }
    .room-info button {
      background: none; border: none; color: var(--primary); font-size: 1.2rem;
      text-decoration: underline; cursor: pointer; padding: 10px; margin-left: 10px;
    }
    .controls-wrapper { display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
    .version { font-size: 0.8rem; color: #aaa; position: absolute; bottom: 10px; }
    #audioContainer { display: none; }
    @media (prefers-reduced-motion: reduce) { .big-btn { transition: none; } }
  </style>
</head>
<body>

  <div id="screenSetup" class="screen">
    <h1>BigTalk Setup</h1>
    <div class="status-container">
      <p class="status">Enter your family room code</p>
      <div id="setupError" class="error-box"></div>
    </div>
    <input type="text" id="roomInput" placeholder="Leave empty for default room">
    <button id="saveBtn" class="btn-save">SAVE & CONTINUE</button>
  </div>

  <div id="screenMain" class="screen">
    <div class="status-container">
      <div id="activeRoomDisplay" class="active-room-display">ROOM: <span id="activeRoomCode">...</span></div>
      <p id="mainStatus" class="status">Getting ready...</p>
      <div id="mainError" class="error-box"></div>
    </div>
    
    <div id="idleControls" class="controls-wrapper">
      <button id="talkBtn" class="big-btn btn-talk" disabled>TALK</button>
      <div class="room-info">
        Saved Room: <strong id="displayRoom">...</strong> 
        <button id="changeRoomBtn">Change</button>
      </div>
    </div>
    
    <div id="callControls" class="controls-wrapper" style="display: none;">
      <button id="endBtn" class="big-btn btn-end">END</button>
      <button id="micBtn" class="big-btn btn-mic">MIC IS ON</button>
    </div>
  </div>

  <div class="version" id="versionText">v3.0 (Max 5 Users) | Disconnected</div>
  <div id="audioContainer"></div>

  <script>
    // Configuration
    const RENDER_DOMAIN = "web-voice-9s2g.onrender.com";
    const IS_LOCAL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
    
    const API_URL = IS_LOCAL ? 'http://localhost:8080' : `https://${RENDER_DOMAIN}`;
    const WS_URL = IS_LOCAL ? 'ws://localhost:8080' : `wss://${RENDER_DOMAIN}`;

    // Elements
    const screenSetup = document.getElementById('screenSetup');
    const screenMain = document.getElementById('screenMain');
    const roomInput = document.getElementById('roomInput');
    const saveBtn = document.getElementById('saveBtn');
    
    const mainStatus = document.getElementById('mainStatus');
    const mainError = document.getElementById('mainError');
    const setupError = document.getElementById('setupError');
    const activeRoomDisplay = document.getElementById('activeRoomDisplay');
    const activeRoomCode = document.getElementById('activeRoomCode');
    
    const displayRoom = document.getElementById('displayRoom');
    const changeRoomBtn = document.getElementById('changeRoomBtn');
    
    const idleControls = document.getElementById('idleControls');
    const callControls = document.getElementById('callControls');
    const talkBtn = document.getElementById('talkBtn');
    const endBtn = document.getElementById('endBtn');
    const micBtn = document.getElementById('micBtn');
    const versionText = document.getElementById('versionText');
    const audioContainer = document.getElementById('audioContainer');

    // State
    let roomCode = localStorage.getItem('bigtalk_room') || '';
    let localStream = null;
    let ws = null;
    let isServerReady = false;
    let isMuted = false;
    let wakeLock = null;
    
    // peers Map: peerId -> { pc, audioEl, isRemoteDescriptionSet, iceCandidateQueue }
    let peers = new Map();

    const iceConfig = {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "turn:openrelay.metered.ca:80", username: "openrelayproject", credential: "openrelayproject" },
        { urls: "turn:openrelay.metered.ca:443", username: "openrelayproject", credential: "openrelayproject" }
      ]
    };

    // Initialization
    function init() {
      if (roomCode) {
        showScreen('main');
        checkServer();
      } else {
        showScreen('setup');
      }
    }

    function showScreen(screen) {
      screenSetup.classList.remove('active');
      screenMain.classList.remove('active');
      hideError();
      if (screen === 'setup') {
        screenSetup.classList.add('active');
        roomInput.value = roomCode;
      } else {
        screenMain.classList.add('active');
        displayRoom.textContent = roomCode || 'MAIN';
      }
    }

    function sanitizeRoom(code) {
      return code.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
    }

    function setStatus(text) {
      mainStatus.textContent = text;
    }
    
    function showError(errText) {
      mainError.textContent = "Error Details: " + errText;
      mainError.style.display = 'block';
    }
    
    function hideError() {
      mainError.style.display = 'none';
      setupError.style.display = 'none';
      mainError.textContent = '';
      setupError.textContent = '';
    }

    function updateDebugInfo() {
      const wsState = ws ? (ws.readyState === 1 ? 'ws-open' : 'ws-closed') : 'no-ws';
      versionText.textContent = `v3.0 (Max 5 Users) | Peers: ${peers.size} | ${wsState}`;
      
      if (peers.size > 0) {
        setStatus(`Connected to ${peers.size} person(s). You can talk now.`);
      } else if (callControls.style.display !== 'none') {
        setStatus("Waiting for someone to join...");
      }
    }

    // Server Wakeup
    async function checkServer() {
      if (isServerReady) return;
      const startTime = Date.now();
      talkBtn.disabled = true;
      setStatus("Getting ready (waking up server)...");
      hideError();
      
      while (!isServerReady) {
        if (Date.now() - startTime > 60000) {
          setStatus("Server took too long to wake up.");
          showError("The server at " + RENDER_DOMAIN + " is not responding. Please check your internet or try again later.");
          return;
        }
        try {
          const res = await fetch(API_URL + '/health');
          if (res.ok) {
            isServerReady = true;
            talkBtn.disabled = false;
            setStatus("Press TALK when you are ready.");
            updateDebugInfo();
            break;
          }
        } catch(e) {}
        await new Promise(r => setTimeout(r, 3000));
      }
    }

    saveBtn.addEventListener('click', () => {
      roomCode = sanitizeRoom(roomInput.value);
      localStorage.setItem('bigtalk_room', roomCode);
      showScreen('main');
      checkServer();
    });

    changeRoomBtn.addEventListener('click', () => {
      endCall();
      showScreen('setup');
    });

    micBtn.addEventListener('click', () => {
      if (localStream) {
        isMuted = !isMuted;
        localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
        micBtn.classList.toggle('muted', isMuted);
        micBtn.textContent = isMuted ? 'MIC IS OFF' : 'MIC IS ON';
      }
    });

    // START CALL
    talkBtn.addEventListener('click', async () => {
      hideError();
      setStatus("Asking for microphone...");
      
      // Clean up any old state completely
      closeSocket();
      removeAllPeers();
      
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        isMuted = false;
        micBtn.classList.remove('muted');
        micBtn.textContent = 'MIC IS ON';
        
        try {
          if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
        } catch(e) {}
      } catch (err) {
        setStatus("Cannot make call.");
        showError("Microphone permission was denied or no microphone found. You must allow microphone access in your browser settings to talk.");
        return;
      }
      
      idleControls.style.display = 'none';
      callControls.style.display = 'flex';
      
      connectSocket();
    });

    // WEBSOCKET LOGIC
    function connectSocket(retryCount = 0) {
      if (ws) {
        ws.onclose = null;
        ws.close();
      }
      setStatus(retryCount > 0 ? "Reconnecting to server..." : "Connecting to server...");
      
      ws = new WebSocket(WS_URL);
      
      ws.onopen = () => {
        hideError();
        updateDebugInfo();
        ws.send(JSON.stringify({ type: 'join', room: roomCode }));
        setStatus("Waiting for someone to join...");
      };
      
      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        
        if (msg.type === 'full') {
          setStatus("Room is full (Max 5 people).");
          showError("The room you tried to join already has the maximum of 5 people in it. Try a different room code.");
          endCall();
        }
        else if (msg.type === 'room-joined') {
          // We successfully joined.
          activeRoomCode.textContent = msg.room;
          activeRoomDisplay.style.display = 'block';
          
          // Connect to all existing peers in the room
          msg.peers.forEach(peerId => {
            if (peerId !== msg.yourId) {
              createPeerConnection(peerId, true); // We are the initiator (create offer)
            }
          });
        }
        else if (msg.type === 'peer-joined') {
          // Someone new joined. They will send the offer, we just setup the PC and wait.
          createPeerConnection(msg.peerId, false);
        }
        else if (msg.type === 'peer-left') {
          removePeer(msg.peerId);
        }
        else if (msg.type === 'signal') {
          handleSignal(msg.senderId, msg.data);
        }
      };
      
      ws.onclose = () => {
        updateDebugInfo();
        if (callControls.style.display !== 'none') {
          setStatus("Connection dropped. Reconnecting...");
          showError("Lost connection to the signaling server. Trying to reconnect automatically...");
          const delay = Math.min(1000 * Math.pow(2, retryCount), 4000);
          setTimeout(() => connectSocket(retryCount + 1), delay);
        }
      };
      
      ws.onerror = (e) => {
        console.error("WebSocket error");
      };
    }

    function closeSocket() {
      if (ws) {
        if (ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'leave' }));
        }
        ws.onclose = null;
        ws.close();
        ws = null;
      }
    }

    // WEBRTC PEER LOGIC (Mesh Network)
    function createPeerConnection(peerId, isInitiator) {
      if (peers.has(peerId)) return; // Already exists
      
      const pc = new RTCPeerConnection(iceConfig);
      
      const audioEl = new Audio();
      audioEl.autoplay = true;
      audioContainer.appendChild(audioEl);
      
      const peerState = {
        pc: pc,
        audioEl: audioEl,
        isRemoteDescriptionSet: false,
        iceCandidateQueue: []
      };
      peers.set(peerId, peerState);
      
      // Add local stream tracks
      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
      
      pc.onicecandidate = (event) => {
        if (event.candidate && ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'signal', targetId: peerId, data: { candidate: event.candidate } }));
        }
      };
      
      pc.ontrack = (event) => {
        audioEl.srcObject = event.streams[0];
        updateDebugInfo();
      };
      
      pc.oniceconnectionstatechange = () => {
        if (pc.iceConnectionState === 'failed' || pc.iceConnectionState === 'disconnected') {
           console.log(`Connection to peer ${peerId} failed or disconnected.`);
           showError(`Lost audio connection to one of the users. They may have disconnected abruptly.`);
           removePeer(peerId);
        }
        updateDebugInfo();
      };

      if (isInitiator) {
        makeOffer(peerId, pc);
      }
    }

    async function makeOffer(peerId, pc) {
      try {
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'signal', targetId: peerId, data: { sdp: pc.localDescription } }));
        }
      } catch (e) {
        showError(`Failed to create connection offer for a peer: ${e.message}`);
      }
    }

    async function handleSignal(senderId, data) {
      let peerState = peers.get(senderId);
      
      if (!peerState) {
        // Fallback: If we get a signal but don't have a PC, create one as non-initiator
        createPeerConnection(senderId, false);
        peerState = peers.get(senderId);
      }
      
      const pc = peerState.pc;

      try {
        if (data.sdp) {
          await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
          peerState.isRemoteDescriptionSet = true;
          
          // Process queued ICE candidates
          for (const cand of peerState.iceCandidateQueue) {
            await pc.addIceCandidate(cand);
          }
          peerState.iceCandidateQueue = [];
          
          if (data.sdp.type === 'offer') {
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            if (ws && ws.readyState === WebSocket.OPEN) {
              ws.send(JSON.stringify({ type: 'signal', targetId: senderId, data: { sdp: pc.localDescription } }));
            }
          }
        } else if (data.candidate) {
          const candidate = new RTCIceCandidate(data.candidate);
          if (peerState.isRemoteDescriptionSet) {
            await pc.addIceCandidate(candidate);
          } else {
            peerState.iceCandidateQueue.push(candidate);
          }
        }
      } catch(e) {
        showError(`Failed to process network signal from a peer: ${e.message}`);
      }
    }

    function removePeer(peerId) {
      const peerState = peers.get(peerId);
      if (peerState) {
        peerState.pc.close();
        if (peerState.audioEl && peerState.audioEl.parentNode) {
          peerState.audioEl.parentNode.removeChild(peerState.audioEl);
        }
        peers.delete(peerId);
      }
      updateDebugInfo();
    }

    function removeAllPeers() {
      for (const peerId of peers.keys()) {
        removePeer(peerId);
      }
      peers.clear();
      audioContainer.innerHTML = ''; // clear audio elements just in case
      updateDebugInfo();
    }

    // END CALL
    endBtn.addEventListener('click', endCall);

    function endCall() {
      closeSocket();
      removeAllPeers();
      
      activeRoomDisplay.style.display = 'none';
      hideError();
      
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
      }
      if (wakeLock) {
        wakeLock.release().catch(()=>{});
        wakeLock = null;
      }
      
      idleControls.style.display = 'flex';
      callControls.style.display = 'none';
      setStatus(isServerReady ? "Press TALK when you are ready." : "Getting ready...");
      updateDebugInfo();
    }

    init();
  </script>
</body>
</html>
