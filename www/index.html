<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>BigTalk Voice Chat</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg: #fdfbf7;
      --text: #111;
      --primary: #d7263d;
      --primary-active: #b51f33;
      --dark: #2d2d2d;
      --light-gray: #e0e0e0;
      --mic-on: #28a745;
      --mic-off: #6c757d;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
    }
    
    * { box-sizing: border-box; }

    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 400px;
    }
    .screen.active {
      display: flex;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
    }
    p.status {
      font-size: 1.5rem;
      line-height: 1.4;
      min-height: 4.5rem;
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    input[type="text"] {
      font-size: 2rem;
      padding: 15px;
      width: 100%;
      text-align: center;
      border: 3px solid #ccc;
      border-radius: 12px;
      margin-bottom: 20px;
      text-transform: uppercase;
      background: #fff;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: var(--primary);
    }
    
    .big-btn {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: none;
      font-size: 2.5rem;
      font-weight: bold;
      color: white;
      cursor: pointer;
      transition: transform 0.1s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }
    .big-btn:active {
      transform: scale(0.95);
    }
    .big-btn:focus-visible {
      outline: 6px solid #111;
      outline-offset: 4px;
    }

    .btn-talk {
      background-color: var(--primary);
      box-shadow: 0 10px 20px rgba(215, 38, 61, 0.4);
    }
    .btn-end {
      background-color: var(--dark);
      box-shadow: 0 10px 20px rgba(45, 45, 45, 0.4);
    }
    
    .btn-mic {
      background-color: var(--mic-on);
      width: 140px;
      height: 140px;
      font-size: 1.5rem;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      margin-top: 10px;
    }
    .btn-mic.muted {
      background-color: var(--mic-off);
    }
    
    .btn-save {
      width: 100%;
      padding: 20px;
      font-size: 1.5rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-save:active {
      background: var(--primary-active);
    }
    
    .room-info {
      font-size: 1.2rem;
      margin-top: 40px;
      color: #555;
    }
    .room-info button {
      background: none;
      border: none;
      color: var(--primary);
      font-size: 1.2rem;
      text-decoration: underline;
      cursor: pointer;
      padding: 10px;
      margin-left: 10px;
    }
    
    .controls-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    @media (prefers-reduced-motion: reduce) {
      .big-btn { transition: none; }
    }
  </style>
</head>
<body>

  <!-- SETUP SCREEN -->
  <div id="screenSetup" class="screen">
    <h1>BigTalk Setup</h1>
    <p class="status">Enter your family room code</p>
    <input type="text" id="roomInput" placeholder="e.g. 1234">
    <button id="saveBtn" class="btn-save">SAVE & CONTINUE</button>
  </div>

  <!-- MAIN SCREEN -->
  <div id="screenMain" class="screen">
    <p id="mainStatus" class="status">Press TALK when you are ready.</p>
    
    <div id="idleControls" class="controls-wrapper">
      <button id="talkBtn" class="big-btn btn-talk">TALK</button>
      <div class="room-info">
        Room: <strong id="displayRoom">...</strong> 
        <button id="changeRoomBtn">Change</button>
      </div>
    </div>
    
    <div id="callControls" class="controls-wrapper" style="display: none;">
      <button id="endBtn" class="big-btn btn-end">END</button>
      <button id="micBtn" class="big-btn btn-mic">MIC IS ON</button>
    </div>
  </div>

  <script>
    // State
    let roomCode = localStorage.getItem('bigtalk_room') || '';
    let localStream = null;
    let peer = null;
    let call = null;
    let wakeLock = null;
    let isMuted = false;
    let audioEl = new Audio();
    audioEl.autoplay = true;

    // Elements
    const screenSetup = document.getElementById('screenSetup');
    const screenMain = document.getElementById('screenMain');
    const roomInput = document.getElementById('roomInput');
    const saveBtn = document.getElementById('saveBtn');
    const mainStatus = document.getElementById('mainStatus');
    const displayRoom = document.getElementById('displayRoom');
    const changeRoomBtn = document.getElementById('changeRoomBtn');
    const idleControls = document.getElementById('idleControls');
    const callControls = document.getElementById('callControls');
    const talkBtn = document.getElementById('talkBtn');
    const endBtn = document.getElementById('endBtn');
    const micBtn = document.getElementById('micBtn');

    // Config
    const peerConfig = {
      config: {
        iceServers: [
          { urls: "stun:stun.l.google.com:19302" },
          { urls: "turn:openrelay.metered.ca:80", username: "openrelayproject", credential: "openrelayproject" },
          { urls: "turn:openrelay.metered.ca:443", username: "openrelayproject", credential: "openrelayproject" },
          { urls: "turn:openrelay.metered.ca:443?transport=tcp", username: "openrelayproject", credential: "openrelayproject" }
        ]
      }
    };

    // UI Navigation
    function showScreen(screen) {
      screenSetup.classList.remove('active');
      screenMain.classList.remove('active');
      
      if (screen === 'setup') {
        screenSetup.classList.add('active');
        roomInput.value = roomCode;
        if(roomCode === '') roomInput.focus();
      } else {
        screenMain.classList.add('active');
        displayRoom.textContent = roomCode;
        resetUI();
      }
    }

    function sanitizeRoom(code) {
      return code.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
    }

    function getHostId() {
      return `bigtalk-${sanitizeRoom(roomCode)}-host`;
    }

    function setStatus(text) {
      mainStatus.textContent = text;
    }

    // Init
    if (roomCode) {
      showScreen('main');
    } else {
      showScreen('setup');
    }

    // Setup events
    saveBtn.addEventListener('click', () => {
      const val = sanitizeRoom(roomInput.value);
      if (val.length < 2) {
        alert("Please enter a room code (at least 2 letters or numbers).");
        return;
      }
      roomCode = val;
      localStorage.setItem('bigtalk_room', roomCode);
      showScreen('main');
    });

    changeRoomBtn.addEventListener('click', () => {
      endCall();
      showScreen('setup');
    });

    // Mic Toggle
    micBtn.addEventListener('click', () => {
      if (localStream) {
        isMuted = !isMuted;
        localStream.getAudioTracks().forEach(track => {
          track.enabled = !isMuted;
        });
        
        if (isMuted) {
          micBtn.classList.add('muted');
          micBtn.textContent = 'MIC IS OFF';
        } else {
          micBtn.classList.remove('muted');
          micBtn.textContent = 'MIC IS ON';
        }
      }
    });

    // Start Call process
    talkBtn.addEventListener('click', async () => {
      setStatus("Asking for microphone...");
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        
        // Reset mic state
        isMuted = false;
        micBtn.classList.remove('muted');
        micBtn.textContent = 'MIC IS ON';
        
        try {
          if ('wakeLock' in navigator) {
            wakeLock = await navigator.wakeLock.request('screen');
          }
        } catch(e) {
          console.error("WakeLock failed", e);
        }
      } catch (err) {
        setStatus("Microphone permission denied. Please allow it and try again.");
        return;
      }
      
      idleControls.style.display = 'none';
      callControls.style.display = 'flex';
      setStatus("Connecting to room...");
      
      connectToRoom();
    });

    function connectToRoom() {
      if (peer) peer.destroy();
      
      const hostId = getHostId();
      peer = new Peer(hostId, peerConfig);
      
      peer.on('open', () => {
        setStatus("Waiting for someone to join...");
      });
      
      peer.on('call', (incomingCall) => {
        if (call) {
           incomingCall.close(); // Only allow one active call
           return;
        }
        call = incomingCall;
        call.answer(localStream);
        setupCallEvents();
      });
      
      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          // Host already exists! We are the caller.
          peer.destroy();
          startAsCaller();
        } else if (err.type === 'peer-unavailable') {
          setStatus("Connection dropped. Retrying...");
          setTimeout(() => { if (callControls.style.display !== 'none') connectToRoom(); }, 2000);
        } else if (err.type === 'network' || err.type === 'server-error') {
          setStatus("Network error. Retrying...");
          setTimeout(() => { if (callControls.style.display !== 'none') connectToRoom(); }, 3000);
        } else {
          console.error("PeerJS error:", err);
          setStatus("Error connecting. Retrying...");
          setTimeout(() => { if (callControls.style.display !== 'none') connectToRoom(); }, 3000);
        }
      });
      
      peer.on('disconnected', () => {
        if (!peer.destroyed && callControls.style.display !== 'none') peer.reconnect();
      });
    }

    function startAsCaller() {
      peer = new Peer(peerConfig);
      
      peer.on('open', () => {
        setStatus("Calling...");
        const hostId = getHostId();
        call = peer.call(hostId, localStream);
        
        // Timeout if host doesn't answer (e.g. ghost host)
        const callTimeout = setTimeout(() => {
          if (call && (!call.peerConnection || call.peerConnection.iceConnectionState !== 'connected')) {
             console.log("Call timeout, becoming host instead");
             if(call) call.close();
             connectToRoom(); // Fallback to becoming host
          }
        }, 8000);

        call.on('stream', (remoteStream) => {
          clearTimeout(callTimeout);
          audioEl.srcObject = remoteStream;
          setStatus("Connected. You can talk now.");
        });
        
        call.on('close', handleCallClose);
        
        call.on('error', (err) => {
          console.error("Caller call error", err);
          handleCallClose();
        });
      });
      
      peer.on('error', (err) => {
         console.error("Caller peer error", err);
         setStatus("Error connecting. Retrying...");
         setTimeout(() => { if (callControls.style.display !== 'none') connectToRoom(); }, 3000);
      });
      
      peer.on('disconnected', () => {
        if (!peer.destroyed && callControls.style.display !== 'none') peer.reconnect();
      });
    }

    function setupCallEvents() {
      call.on('stream', (remoteStream) => {
        audioEl.srcObject = remoteStream;
        setStatus("Connected. You can talk now.");
      });
      call.on('close', handleCallClose);
      call.on('error', handleCallClose);
    }

    function handleCallClose() {
      if (!call) return;
      call = null;
      if (callControls.style.display === 'none') return; // User pressed END

      setStatus("The other person left. Reconnecting...");
      // Re-enter room as host immediately
      setTimeout(() => {
        if (callControls.style.display !== 'none') {
          connectToRoom();
        }
      }, 1000);
    }

    // Monitor connection health to detect unexpected drops
    setInterval(() => {
      if (call && call.peerConnection) {
        const state = call.peerConnection.iceConnectionState;
        if (state === 'disconnected' || state === 'failed' || state === 'closed') {
          console.log("Call state failed:", state);
          handleCallClose();
        }
      }
    }, 2000);

    // End call button
    endBtn.addEventListener('click', () => {
      endCall();
    });

    function endCall() {
      if (call) {
        call.close();
        call = null;
      }
      if (peer) {
        peer.destroy();
        peer = null;
      }
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }
      if (wakeLock) {
        wakeLock.release().catch(()=>{});
        wakeLock = null;
      }
      
      resetUI();
    }

    function resetUI() {
      idleControls.style.display = 'flex';
      callControls.style.display = 'none';
      setStatus("Press TALK when you are ready.");
    }
  </script>
</body>
</html>
